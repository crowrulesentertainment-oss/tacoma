<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CrowRules Replay Player</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070c;color:#e8f5fb;font-family:Arial,sans-serif}#player{position:absolute;inset:0;width:100%;height:100%}#idle{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at center,#16364b 0,#071522 52%,#02070c 100%);z-index:2}#idle b{font-size:clamp(22px,4vw,54px);letter-spacing:.14em;color:#7ce8f4}#idle span{margin-top:12px;font-size:clamp(12px,1.5vw,18px);letter-spacing:.2em;color:#b9d3df}#error{position:absolute;left:18px;bottom:14px;font-size:12px;color:#ffb6b6;z-index:3}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="../assets/js/config.js"></script></head><body><div id="player"></div><div id="idle"><b>24 HOURS OF TACOMA</b><span>PRERECORDED PROGRAMMING · STANDBY</span></div><div id="error"></div><script>
(()=>{"use strict";let db,player,ready=false,lastId=null;const idle=document.getElementById("idle"),err=document.getElementById("error"),cfg=window.HUB_CONFIG||{};function showError(m){err.textContent=m}function initPlayer(){if(!window.YT||!YT.Player){setTimeout(initPlayer,250);return}player=new YT.Player("player",{width:"100%",height:"100%",videoId:"",playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,modestbranding:1,playsinline:1,rel:0},events:{onReady:()=>{ready=true;poll()},onError:e=>showError("YouTube player error · "+e.data)}})}async function poll(){if(!db)return;try{const {data,error}=await db.from("tacoma_replay_state").select("video_id,video_title,updated_at").eq("event_key","nye_2026_2027").maybeSingle();if(error)throw error;const id=data?.video_id||null;if(id!==lastId&&ready){lastId=id;if(id){idle.style.display="none";player.loadVideoById({videoId:id,suggestedQuality:"hd1080"})}else{player.stopVideo();idle.style.display="grid"}}}catch(e){showError("Replay connection unavailable · "+(e.message||""))}setTimeout(poll,1800)}function start(){if(!window.supabase||!cfg.url||!cfg.key){showError("Supabase player configuration unavailable.");return}db=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);window.onYouTubeIframeAPIReady=initPlayer}window.addEventListener("load",()=>setTimeout(start,300))})();
</script></body></html>
